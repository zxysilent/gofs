name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build

      # web/dist is not committed: the Go job below embeds exactly this artifact,
      # so the binary always ships what the frontend sources produce.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend (Go)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^web/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -trimpath -o gofs .

      - name: Smoke test the binary
        run: |
          ./gofs --version
          ./gofs -A -p 18080 -b 127.0.0.1 ./docs > /tmp/gofs.log 2>&1 &
          server=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/gofs-healthz > /dev/null; then break; fi
            sleep 0.2
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:18080/gofs-healthz
          echo
          echo "--- json listing ---"
          curl -fsS "http://127.0.0.1:18080/?json=" | head -c 200
          echo
          echo "--- virtual docs (zh / en) ---"
          curl -fsS http://127.0.0.1:18080/gofs-agent.md | head -1
          curl -fsS 'http://127.0.0.1:18080/gofs-agent.md?lang=en' | head -1
          kill "$server"
