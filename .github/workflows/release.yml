name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0); the tag must already exist'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: '386'
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: freebsd
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Derive the version from the tag: "v0.1.0" -> "0.1.0".
      - name: Resolve version
        id: meta
        run: |
          ref='${{ inputs.tag || github.ref_name }}'
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "Releasing $ref"

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          # Archive name: gofs_<version>_<os>_<arch>[v<goarm>]
          name="gofs_${VERSION}_${GOOS}_${GOARCH}"
          if [ -n "${GOARM:-}" ]; then
            name="${name}v${GOARM}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

          bin="gofs"
          if [ "$GOOS" = "windows" ]; then bin="gofs.exe"; fi

          # CGO stays off so the binaries are fully static and portable.
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${bin}" .

          # Ship the license and docs alongside the binary.
          cp LICENSE README.md README.zh-CN.md dist/

          # Confirm the version was baked in. Binaries cross-compiled for a
          # foreign platform cannot be executed on this runner, so only run the
          # one built for the runner itself and grep the rest.
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            reported="$("./dist/${bin}" --version)"
            echo "executed: $reported"
            case "$reported" in
              *"${VERSION}") ;;
              *) echo "::error::version mismatch: expected ${VERSION}, got ${reported}"; exit 1 ;;
            esac
          else
            if ! grep -aqF -- "${VERSION}" "dist/${bin}"; then
              echo "::error::version ${VERSION} not found inside dist/${bin}"
              exit 1
            fi
            echo "version string present in dist/${bin} (cross-compiled, not executed)"
          fi
          file "dist/${bin}" || true

          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q -r "../${name}.zip" .)
            echo "archive=${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${name}.tar.gz" -C dist .
            echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

          ls -lh "${name}".*

      - name: Checksums
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          set -euo pipefail
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          # NOTE: upload-artifact@v4 takes `path`, not `files`.
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 说明正文里的示例版本要跟随本次 tag，不能写死。
      - name: Resolve version
        id: meta
        run: |
          ref='${{ inputs.tag || github.ref_name }}'
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          for f in *.sha256; do
            [ -e "$f" ] || continue
            cat "$f" >> SHA256SUMS
          done
          rm -f ./*.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          echo "--- files ---"
          ls -lh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*
          body: |
            ## Install

            Linux / macOS / FreeBSD — installs the newest release into `/usr/local/bin`:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/zxysilent/gofs/master/install.sh | bash
            ```

            Pin a version, or skip sudo:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/zxysilent/gofs/master/install.sh | bash -s -- --version ${{ steps.meta.outputs.version }}
            curl -fsSL https://raw.githubusercontent.com/zxysilent/gofs/master/install.sh | bash -s -- --dir "$HOME/.local/bin"
            ```

            Prefer a manual download? Grab an archive below and verify it against `SHA256SUMS`:

            ```sh
            sha256sum -c --ignore-missing SHA256SUMS
            ```

            ## 安装

            Linux / macOS / FreeBSD —— 安装最新版到 `/usr/local/bin`：

            ```sh
            curl -fsSL https://raw.githubusercontent.com/zxysilent/gofs/master/install.sh | bash
            ```

            也可以指定版本或安装目录：

            ```sh
            curl -fsSL https://raw.githubusercontent.com/zxysilent/gofs/master/install.sh | bash -s -- --version ${{ steps.meta.outputs.version }}
            curl -fsSL https://raw.githubusercontent.com/zxysilent/gofs/master/install.sh | bash -s -- --dir "$HOME/.local/bin"
            ```

            也可以手动下载下方压缩包，并用 `SHA256SUMS` 校验：

            ```sh
            sha256sum -c --ignore-missing SHA256SUMS
            ```
